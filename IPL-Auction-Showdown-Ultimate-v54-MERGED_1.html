dgeResult.decision?.reasons||[]).map(x=>html`<span class="inline-block bg-slate-800 rounded-full px-3 py-2 mr-2 mb-2">✓ ${x}</span>`)}</div></div>`}</div>${judgeResult?.decision?.comparison&&html`<div class="card p-5 mt-5 border border-amber-500/30"><h2 class="text-xl font-black">⚖️ Top-two Verdict</h2><div class="grid md:grid-cols-3 gap-3 mt-3 text-sm"><div class="bg-slate-950 rounded-xl p-3"><b>How</b><div class="mt-1">${judgeResult.decision.comparison.how}</div></div><div class="bg-slate-950 rounded-xl p-3"><b>Win chance</b><div class="mt-1 text-xl font-black">${Math.round((judgeResult.decision.winChance||0)*100)}%</div><div class="text-xs text-slate-400">${judgeResult.decision.top.name} over ${judgeResult.decision.second.name}</div></div><div class="bg-slate-950 rounded-xl p-3"><b>What would change my mind</b><div class="mt-1">${judgeResult.decision.comparison.whatWouldChangeMyMind}</div></div></div><div class="mt-3 text-sm"><b>Why</b>${judgeResult.decision.comparison.reasons.map(x=>html`<div class="mt-1">• ${x}</div>`)}</div></div>`}<div class="card p-5 mt-5"><h2 class="text-xl font-black">💰 Player Value Table</h2><div class="overflow-auto mt-3"><table class="w-full text-xs"><thead><tr class="text-slate-400"><th class="text-left py-2">Team</th><th class="text-left">Player</th><th>Paid</th><th>Market value</th><th class="text-left">Label</th></tr></thead><tbody>${rows.flatMap(x=>x.cm.value.rows.map(v=>html`<tr class="border-t border-slate-800"><td class="py-1">${x.t.name}</td><td>${v.n}</td><td class="text-right">${cmCr(v.paid)}</td><td class="text-right">${cmCr(v.fair)}</td><td class="pl-3">${v.label}</td></tr>`))}</tbody></table></div></div><div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4 mt-5">${rows.map((x,i)=>{const c=x.cm,n=x.t,r=x.r,notes=cmTeamNotes(c,rows[i===0?1:0]?.cm);return html`<div class="card p-4"><div class="flex justify-between gap-2"><div><div class="text-xs text-slate-400">#${i+1}</div><h2 class="text-xl font-black">${n.name}</h2><div class="text-xs text-amber-300">${c.grade} • Squad Strength</div></div><span class="text-3xl font-black text-indigo-300">${c.strength}</span></div><div class="grid grid-cols-3 gap-1 mt-4 text-xs"><div class="bg-slate-950 rounded p-2"><b>${c.xi.batting}</b><br/>Batting</div><div class="bg-slate-950 rounded p-2"><b>${c.xi.bowling}</b><br/>Bowling</div><div class="bg-slate-950 rounded p-2"><b>${c.xi.balance}</b><br/>Balance</div></div><div class="grid grid-cols-2 gap-2 mt-3 text-xs"><div class="bg-slate-950 rounded p-2"><b>${c.bench.applicable?c.bench.score:'No bench'}</b><br/>Bench depth</div><div class="bg-slate-950 rounded p-2"><b>${c.value.score}</b> • ${c.valueGrade}<br/>Value for money</div></div><div class="bg-slate-950 rounded-xl p-3 mt-3 text-xs"><b>⭐ Best buy</b><div class="mt-1">${cmDescribePlayerValue(c.value.bestBuy)}</div><div class="mt-2"><b>⚠️ Worst buy</b></div><div class="mt-1">${cmDescribePlayerValue(c.value.worstBuy)}</div></div><div class="bg-slate-950 rounded-xl p-3 mt-3 text-xs"><b>🎯 Shortlist:</b> ${x.target.success}% • Won ${x.target.won.length} • Missed ${(x.target.missed||[]).join(', ')||'none'} • Target spend ${fmt2(x.target.spent)}</div><div class="grid md:grid-cols-2 gap-3 mt-3 text-xs"><div><b>Strengths</b>${notes.strengths.length?notes.strengths.map(v=>html`<div>• ${v}</div>`):html`<div>• No clear rival edge.</div>`}</div><div><b>Risks</b>${notes.risks.length?notes.risks.map(v=>html`<div>• ${v}</div>`):html`<div>• No major structural gap.</div>`}</div></div><details class="mt-3"><summary class="cursor-pointer font-bold text-xs">Value details</summary><div class="mt-2 max-h-48 overflow-auto text-xs">${c.value.rows.map(v=>html`<div class="flex justify-between gap-2 border-b border-slate-900 py-1"><span>${v.n}${v.inXI?' • XI':' • Bench'}</span><span>₹${(v.paid/100).toFixed(1)} Cr • ₹${(v.fair/100).toFixed(1)} Cr • ${v.label}</span></div>`)}</div></details><details class="mt-2"><summary class="cursor-pointer font-bold text-xs">Full squad (${n.sq.length})</summary><div class="mt-2 text-xs text-slate-400 max-h-40 overflow-auto">${n.sq.map(p=>html`<div class="flex justify-between border-b border-slate-900 py-1"><span>${p.n}</span><span>Q${p.q} • ${RN[p.r]||p.r||'—'} • ${fmt2(p.c||0)}</span></div>`)}</div></details></div>`})}</div><div class="card p-4 mt-5"><div class="flex flex-wrap items-center justify-between gap-2"><div><b>🏏 Season Simulation</b><div class="text-xs text-slate-400">Double round robin → playoffs. Every fixture uses the same XI engine.</div></div><div class="flex gap-2"><button onClick=${()=>doSeason(true)} class="bg-indigo-600 rounded-xl px-4 py-2 font-bold">🎲 New Season (new seed)</button><button onClick=${()=>doSeason(false)} class="bg-slate-700 rounded-xl px-4 py-2 font-bold">↻ Replay This Seed</button></div></div>${seasonResults()}</div><div class="card p-4 mt-5"><b>📜 Complete auction history</b><div class="scroll text-sm mt-2">${(g.history||[]).map((x,i)=>html`<div class="py-2 border-b border-slate-800">${i+1}. ${x.type==='sold'?`🔨 ${x.player} → ${x.team} — ${fmt2(x.price)}`:`❌ ${x.player} — UNSOLD`}</div>`)}</div></div><div class="card p-4 mt-4"><b>📊 Auction summary</b><div class="grid md:grid-cols-4 gap-2 mt-3 text-sm">${[['Players sold',(g.history||[]).filter(x=>x.type==='sold').length],['Unsold',(g.history||[]).filter(x=>x.type==='unsold').length],['Rounds',g.round||1]].map(x=>html`<div class="bg-slate-950 p-3 rounded-xl"><div class="text-xs text-slate-400">${x[0]}</div><b class="text-xl">${x[1]}</b></div>`)}</div></div><div class="card p-4 mt-4"><div class="flex items-center justify-between gap-2"><div><b>▶️ Auction replay</b><div class="text-sm text-slate-400 mt-1">Replay the final history without changing the saved auction.</div></div><div class="flex gap-2"><button onClick=${()=>{setReplayIndex(0);setReplayPlaying(false)}} class="bg-slate-700 rounded-lg px-3 py-2 text-xs font-bold">↺ Reset</button><button onClick=${()=>setReplayPlaying(v=>!v)} disabled=${!(g.history||[]).length} class="bg-indigo-600 rounded-lg px-3 py-2 text-xs font-bold disabled:opacity-40">${replayPlaying?'⏸️ Pause':'▶️ Play'}</button></div></div><div class="bg-slate-950 rounded-xl p-3 mt-3"><div class="text-xs text-slate-500 mb-2">Event ${Math.min(replayIndex+1,(g.history||[]).length)}/${(g.history||[]).length}</div>${(g.history||[]).slice(0,replayIndex+1).slice(-8).map((x,i)=>html`<div class="py-1 border-b border-slate-900">${replayIndex-7+i+1}. ${x.type==='sold'?`🔨 ${x.player} → ${x.team} — ${fmt2(x.price)}`:`❌ ${x.player} — UNSOLD`}</div>`)}</div></div><div class="card p-4 mt-4"><b>🏅 Achievements</b><div class="flex flex-wrap gap-2 mt-2">${achievements(teams[0],teams[1],g).map(x=>html`<span class="bg-slate-800 px-3 py-2 rounded-full">${x}</span>`)}</div></div><div class="grid md:grid-cols-4 gap-2 mt-4">${g.settings?.online?html`<button onClick=${proceedLineup} class="bg-indigo-600 rounded-xl p-3 font-black">➡️ Playing XI</button>`:html`<button onClick=${finishOfflineXI} class="bg-indigo-600 rounded-xl p-3 font-black">⚔️ Auto-pick Playing XIs • Compare XIs • Start Series</button>`}<button disabled=${!R.current.host} onClick=${R.current.host?rematch:undefined} class="bg-purple-600 rounded-xl p-3 font-black">${R.current.host?'🔄 Rematch':'⏳ Waiting for host'}</button><button onClick=${newAuction} class="bg-emerald-600 rounded-xl p-3 font-black">🏠 New Auction</button><button onClick=${exitMatch} class="bg-slate-700 rounded-xl p-3 font-black">🚪 Back to menu</button></div></div>`};

 let content=view==='menu'?menu():view==='lobby'?lobby():view==='auction'?auction():view==='evaluation'?report():view==='lineup'?lineup():view==='series'?seriesView():report();return html`<${React.Fragment}>${content}${err&&html`<div class="toast bg-red-950 text-red-100 border border-red-500/40 rounded-xl px-4 py-3 shadow-2xl">${err}</div>`}</>`
}
