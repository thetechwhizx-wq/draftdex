</button>

<script>
  (() => {
    const input = document.getElementById('room-code-input');
    const joinBtn = document.getElementById('join-room-btn');
    const pasteBtn = document.getElementById('paste-code-btn');
    const resumeCard = document.getElementById('resume-match-card');
    const resetBtn = document.getElementById('reset-data-btn');

    if (input) {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
    }

    if (pasteBtn && input) {
      pasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          const clean = text.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
          if (clean) input.value = clean;
        } catch (_) {}
      });
    }

    if (joinBtn && input) {
      joinBtn.addEventListener('click', () => {
        const code = input.value.trim();
        if (code.length === 6) {
          joinBtn.classList.add('opacity-80');
          setTimeout(() => joinBtn.classList.remove('opacity-80'), 200);
        } else {
          input.focus();
        }
      });
    }

    if (resumeCard) {
      resumeCard.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          resumeCard.click();
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (input) input.value = '';
      });
    }
  })();
