<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>DraftDex — Pokémon Auction</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@400;500;700&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0" rel="stylesheet"/>
  
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PeerJS P2P Networking -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#131314",
            "surface-dim": "#131314",
            "surface-bright": "#393939",
            "surface-container-lowest": "#0e0e0e",
            "surface-container-low": "#1b1c1c",
            "surface-container": "#1f2020",
            "surface-container-high": "#2a2a2a",
            "surface-container-highest": "#343535",
            "on-surface": "#e4e2e2",
            "on-surface-variant": "#c4c7c7",
            "inverse-surface": "#e4e2e2",
            "inverse-on-surface": "#303030",
            "outline": "#8e9192",
            "outline-variant": "#444748",
            "surface-tint": "#c8c6c5",
            "primary": "#c8c6c5",
            "on-primary": "#313030",
            "primary-container": "#1a1a1a",
            "on-primary-container": "#848282",
            "inverse-primary": "#5f5e5e",
            "secondary": "#ffb4a9",
            "on-secondary": "#690002",
            "secondary-container": "#a50005",
            "on-secondary-container": "#ffaea3",
            "tertiary": "#b6c4ff",
            "on-tertiary": "#002780",
            "tertiary-container": "#00144d",
            "on-tertiary-container": "#5179ff",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "primary-fixed": "#e5e2e1",
            "primary-fixed-dim": "#c8c6c5",
            "on-primary-fixed": "#1c1b1b",
            "on-primary-fixed-variant": "#474746",
            "secondary-fixed": "#ffdad5",
            "secondary-fixed-dim": "#ffb4a9",
            "on-secondary-fixed": "#410001",
            "on-secondary-fixed-variant": "#930004",
            "tertiary-fixed": "#dce1ff",
            "tertiary-fixed-dim": "#b6c4ff",
            "on-tertiary-fixed": "#001551",
            "on-tertiary-fixed-variant": "#0039b3",
            "background": "#131314",
            "on-background": "#e4e2e2",
            "surface-variant": "#343535"
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            lg: "0.25rem",
            xl: "0.5rem",
            full: "0.75rem"
          },
          spacing: {
            "gutter-sm": "0.75rem",
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "space-md": "1rem",
            "margin": "2rem",
            "space-xs": "0.25rem",
            "space-xl": "2.5rem",
            "margin-lg": "1.5rem",
            "gutter": "1.5rem"
          },
          fontFamily: {
            "body-md": ["Inter"],
            "headline-lg-mobile": ["Oswald"],
            "numeral-xl": ["Inter"],
            "display-auction": ["Oswald"],
            "display-auction-mobile": ["Oswald"],
            "numeral-lg": ["Inter"],
            "headline-lg": ["Space Grotesk"],
            "headline-md": ["Oswald"],
            "tabular-stats": ["Inter"],
            "headline-sm": ["Oswald"],
            "label-caps": ["Oswald"],
            "body-sm": ["Inter"],
            "headline": ["Space Grotesk"],
            "display": ["Space Grotesk"],
            "body": ["Inter"],
            "label": ["Space Grotesk"],
            "label-md": ["Space Grotesk"]
          },
          fontSize: {
            "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "headline-lg-mobile": ["26px", { lineHeight: "30px", letterSpacing: "0.03em", fontWeight: "600" }],
            "numeral-xl": ["32px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "display-auction": ["48px", { lineHeight: "52px", letterSpacing: "0.02em", fontWeight: "700" }],
            "display-auction-mobile": ["36px", { lineHeight: "40px", letterSpacing: "0.02em", fontWeight: "700" }],
            "numeral-lg": ["22px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "700" }],
            "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
            "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "0.04em", fontWeight: "600" }],
            "tabular-stats": ["13px", { lineHeight: "16px", fontWeight: "600" }],
            "headline-sm": ["18px", { lineHeight: "24px", letterSpacing: "0.05em", fontWeight: "500" }],
            "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "600" }],
            "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen items-center">
  <div class="w-full max-w-[390px] md:max-w-[768px] relative flex flex-col min-h-screen bg-surface px-margin pb-safe pt-safe" id="app-root">
    <!-- Screen content injected dynamically by UI router -->
  </div>

  <script type="module">
    import { DraftDexApp } from './ui/app.js';
    const app = new DraftDexApp();
    app.init();
    window.draftDexApp = app;
  </script>
</body>
</html>
